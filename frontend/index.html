<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy Wall — F1 Race Strategy Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #0B0D10;
    --bg-panel: #14171C;
    --bg-panel-raised: #1B1F26;
    --border-hairline: #262B33;
    --text-primary: #E8EAED;
    --text-secondary: #838B99;
    --text-tertiary: #565D68;
    --accent: #00E5A0;
    --accent-dim: #0A2E24;
    --tire-soft: #E10600;
    --tire-medium: #F5D300;
    --tire-hard: #E8EAED;
    --danger: #FF4D4D;
    --font-display: 'Barlow Condensed', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 24px;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--border-hairline);
    padding-bottom: 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.01em;
    line-height: 1;
  }
  .conn-status {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-tertiary);
  }
  .dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.error { background: var(--danger); }

  /* ---------- Circuit tabs ---------- */
  .tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 24px;
    border: 1px solid var(--border-hairline);
    background: var(--bg-panel);
    width: fit-content;
    border-radius: 4px;
    overflow: hidden;
  }
  .tab {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 10px 20px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tab:hover { color: var(--text-primary); background: var(--bg-panel-raised); }
  .tab.active { color: var(--bg-void); background: var(--accent); }
  .tab:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Hero stats ---------- */
  .hero {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border-hairline);
    border: 1px solid var(--border-hairline);
    margin-bottom: 24px;
    border-radius: 4px;
    overflow: hidden;
  }
  .stat {
    background: var(--bg-panel);
    padding: 18px 20px;
  }
  .stat .label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 8px;
  }
  .stat .value {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 26px;
    color: var(--text-primary);
  }
  .stat .value.accent { color: var(--accent); }
  .stat .sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  /* ---------- Strategy bar (signature element) ---------- */
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-hairline);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .panel-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
    margin-bottom: 16px;
  }

  .strategy-bar-track {
    display: flex;
    height: 56px;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--border-hairline);
  }
  .stint-block {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 12px;
    color: var(--bg-void);
    border-right: 2px solid var(--bg-void);
    transition: filter 0.15s;
  }
  .stint-block:last-child { border-right: none; }
  .stint-block:hover { filter: brightness(1.15); }
  .stint-block.hard { color: var(--bg-void); }
  .lap-ruler {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-tertiary);
    margin-top: 6px;
  }
  .legend {
    display: flex;
    gap: 18px;
    margin-top: 16px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
  }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }

  /* ---------- Two column layout ---------- */
  .grid-2 {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } .hero { grid-template-columns: 1fr 1fr; } }

  /* Stint detail list */
  .stint-row {
    display: grid;
    grid-template-columns: 20px 90px 1fr 70px;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-hairline);
    font-family: var(--font-mono);
    font-size: 13px;
  }
  .stint-row:last-child { border-bottom: none; }
  .stint-num { color: var(--text-tertiary); font-size: 11px; }
  .stint-compound { text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
  .stint-laps { color: var(--text-secondary); }
  .stint-len { text-align: right; color: var(--text-primary); }

  /* Compare bars (stop count comparison) */
  .compare-row {
    display: grid;
    grid-template-columns: 70px 1fr 90px;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .compare-label { color: var(--text-secondary); text-transform: uppercase; }
  .compare-track { background: var(--bg-panel-raised); border-radius: 2px; height: 10px; overflow: hidden; }
  .compare-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .compare-fill.best { background: var(--accent); }
  .compare-fill.rest { background: var(--text-tertiary); }
  .compare-time { text-align: right; color: var(--text-primary); }
  .compare-time.best-time { color: var(--accent); font-weight: 700; }
  .infeasible { color: var(--text-tertiary); font-style: italic; }

  .footer-note {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-tertiary);
    margin-top: 24px;
    text-align: center;
    letter-spacing: 0.04em;
  }

  .loading, .error-box {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-secondary);
    padding: 40px 0;
    text-align: center;
  }
  .error-box { color: var(--danger); }
  .error-box code {
    display: block;
    margin-top: 8px;
    color: var(--text-secondary);
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">Pit Wall / Strategy Terminal</div>
      <h1>Race Strategy Simulator</h1>
    </div>
    <div class="conn-status" id="connStatus">
      <span class="dot" id="connDot"></span>
      <span id="connText">connecting to localhost:8000…</span>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div id="content">
    <div class="loading">loading telemetry…</div>
  </div>

  <div class="footer-note">DP OVER (LAP, COMPOUND, TIRE_AGE) &nbsp;·&nbsp; DEGRADATION MODEL IS ILLUSTRATIVE, NOT LIVE TELEMETRY</div>
</div>

<script>
const API_BASE = "";
const CIRCUITS = ["monza", "monaco", "silverstone", "spa"];
const CIRCUIT_LABELS = { monza: "Monza", monaco: "Monaco", silverstone: "Silverstone", spa: "Spa-Francorchamps" };
const COMPOUND_COLOR = { soft: "var(--tire-soft)", medium: "var(--tire-medium)", hard: "var(--tire-hard)" };

let activeCircuit = "monza";

function buildTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  CIRCUITS.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "tab" + (c === activeCircuit ? " active" : "");
    btn.textContent = CIRCUIT_LABELS[c];
    btn.onclick = () => { activeCircuit = c; buildTabs(); loadCircuit(c); };
    tabsEl.appendChild(btn);
  });
}

function setConn(status) {
  const dot = document.getElementById("connDot");
  const text = document.getElementById("connText");
  dot.className = "dot" + (status === "live" ? " live" : status === "error" ? " error" : "");
  text.textContent = status === "live" ? "live · localhost:8000"
    : status === "error" ? "server unreachable"
    : "connecting to localhost:8000…";
}

function renderStrategyBar(stints, totalLaps) {
  const track = document.createElement("div");
  track.className = "strategy-bar-track";
  stints.forEach(s => {
    const block = document.createElement("div");
    const pct = (s.length / totalLaps) * 100;
    block.className = "stint-block " + s.compound;
    block.style.width = pct + "%";
    block.style.background = COMPOUND_COLOR[s.compound] || "#666";
    block.textContent = s.compound.toUpperCase();
    block.title = `${s.compound} · laps ${s.start_lap}-${s.end_lap} (${s.length} laps)`;
    track.appendChild(block);
  });

  const ruler = document.createElement("div");
  ruler.className = "lap-ruler";
  ruler.innerHTML = `<span>LAP 1</span><span>LAP ${totalLaps}</span>`;

  const legend = document.createElement("div");
  legend.className = "legend";
  ["soft", "medium", "hard"].forEach(comp => {
    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = `<span class="swatch" style="background:${COMPOUND_COLOR[comp]}"></span>${comp}`;
    legend.appendChild(item);
  });

  const wrap = document.createElement("div");
  wrap.appendChild(track);
  wrap.appendChild(ruler);
  wrap.appendChild(legend);
  return wrap;
}

function renderStintList(stints) {
  const wrap = document.createElement("div");
  stints.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "stint-row";
    row.innerHTML = `
      <span class="stint-num">${String(i + 1).padStart(2, "0")}</span>
      <span class="stint-compound" style="color:${COMPOUND_COLOR[s.compound]}">${s.compound}</span>
      <span class="stint-laps">laps ${s.start_lap}–${s.end_lap}</span>
      <span class="stint-len">${s.length} laps</span>
    `;
    wrap.appendChild(row);
  });
  return wrap;
}

function renderCompare(comparison) {
  const feasible = comparison.filter(c => c.feasible);
  const minTime = Math.min(...feasible.map(c => c.total_time_seconds));
  const maxTime = Math.max(...feasible.map(c => c.total_time_seconds));
  const wrap = document.createElement("div");

  comparison.forEach(c => {
    const row = document.createElement("div");
    row.className = "compare-row";
    if (!c.feasible) {
      row.innerHTML = `
        <span class="compare-label">${c.max_stops} stop${c.max_stops !== 1 ? "s" : ""}</span>
        <span class="infeasible">tire life exceeded — not achievable</span>
        <span></span>
      `;
      wrap.appendChild(row);
      return;
    }
    const isBest = c.total_time_seconds === minTime;
    const range = maxTime - minTime || 1;
    const fillPct = 15 + (1 - (c.total_time_seconds - minTime) / range) * 85;
    row.innerHTML = `
      <span class="compare-label">${c.max_stops} stop${c.max_stops !== 1 ? "s" : ""}</span>
      <span class="compare-track"><span class="compare-fill ${isBest ? "best" : "rest"}" style="width:${fillPct}%"></span></span>
      <span class="compare-time ${isBest ? "best-time" : ""}">${c.total_time_formatted}</span>
    `;
    wrap.appendChild(row);
  });
  return wrap;
}

async function loadCircuit(circuit) {
  const content = document.getElementById("content");
  content.innerHTML = '<div class="loading">computing optimal strategy…</div>';

  try {
    const [simRes, cmpRes] = await Promise.all([
      fetch(`${API_BASE}/simulate?circuit=${circuit}`),
      fetch(`${API_BASE}/compare?circuit=${circuit}&max_stops=4`)
    ]);
    if (!simRes.ok || !cmpRes.ok) throw new Error("API returned an error");
    const sim = await simRes.json();
    const cmp = await cmpRes.json();
    setConn("live");
    renderDashboard(sim, cmp);
  } catch (err) {
    setConn("error");
    content.innerHTML = `
      <div class="error-box">
        Could not reach the simulator API.
        <code>Make sure uvicorn is running: uvicorn app.main:app --reload --port 8000</code>
      </div>`;
  }
}

function renderDashboard(sim, cmp) {
  const content = document.getElementById("content");
  content.innerHTML = "";

  // Hero stats
  const hero = document.createElement("div");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="stat">
      <div class="label">Total Race Time</div>
      <div class="value accent">${sim.total_time_formatted}</div>
    </div>
    <div class="stat">
      <div class="label">Pit Stops</div>
      <div class="value">${sim.num_pit_stops}</div>
    </div>
    <div class="stat">
      <div class="label">Laps</div>
      <div class="value">${sim.total_laps}</div>
    </div>
    <div class="stat">
      <div class="label">Circuit</div>
      <div class="value" style="font-size:20px">${sim.circuit}</div>
    </div>
  `;
  content.appendChild(hero);

  // Strategy bar panel
  const barPanel = document.createElement("div");
  barPanel.className = "panel";
  barPanel.innerHTML = `<div class="panel-title">Optimal Strategy</div><div class="panel-sub">stint-by-stint tire plan, proportional to lap count</div>`;
  barPanel.appendChild(renderStrategyBar(sim.stints, sim.total_laps));
  content.appendChild(barPanel);

  // Two column: stint detail + comparison
  const grid = document.createElement("div");
  grid.className = "grid-2";

  const stintPanel = document.createElement("div");
  stintPanel.className = "panel";
  stintPanel.innerHTML = `<div class="panel-title">Stint Breakdown</div><div class="panel-sub">${sim.stints.length} stints</div>`;
  stintPanel.appendChild(renderStintList(sim.stints));

  const comparePanel = document.createElement("div");
  comparePanel.className = "panel";
  comparePanel.innerHTML = `<div class="panel-title">Stop Count Comparison</div><div class="panel-sub">best achievable time at each stop budget</div>`;
  comparePanel.appendChild(renderCompare(cmp.comparison));

  grid.appendChild(stintPanel);
  grid.appendChild(comparePanel);
  content.appendChild(grid);
}

buildTabs();
loadCircuit(activeCircuit);
</script>
</body>
</html>
